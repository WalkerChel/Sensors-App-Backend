name: "sensors-app-backend"

x-common: &common
  stop_grace_period: 2m
  restart: "unless-stopped"
  env_file:
    - .env 
  networks:
    - sensors-backend-network

x-health-defaults: &health-defaults
  interval: 10s
  retries: 5
  start_period: 30s
  timeout: 10s
  

services:
  app:
    <<: *common
    container_name: "sensors-app"
    build:
      context: .
      no_cache: true
    environment:
      - POSTGRES_HOST=postgres_db
      - REDIS_HOST=redis_db
    depends_on: 
      postgres_db:
        condition: service_healthy
        restart: true
      migrator:
        condition: service_completed_successfully
      redis_db:
        condition: service_healthy
        restart: true
    ports: 
      - ${HTTP_SERVER_PORT:-8080}:8080
    volumes:
      - ${ENV_PATH:-.env}:/build/.env

  migrator:
    image: migrate/migrate:v4.20.1
    <<: *common
    container_name: "migrator"
    restart: "no"
    depends_on:
      postgres_db:
        condition: service_healthy
        restart: true
    command: >
      --path migrations
      --database "postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres_db:${POSTGRES_PORT:?}/${POSTGRES_DB:?}?sslmode=${POSTGRES_SSL_MODE:?}" 
      --verbose 
      up
    healthcheck:
      <<: *health-defaults
      test: ["CMD-SHELL", "migrate --version"]
    volumes:
      - ${MIGRATIONS_PATH:?}:/migrations

  postgres_db:
    image: postgres:17.2
    <<: *common
    container_name: "postgres"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:?}
      - POSTGRES_USER=${POSTGRES_USER:?}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
    healthcheck:
      <<: *health-defaults
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
    volumes:
      - ${VOLUMES_PATH:?}/postgres/data:/var/lib/postgresql/data
    ports:
      - ${POSTGRES_PORT:-5432}:5432
  
  redis_db:
    image: redis:7.4.1
    <<: *common
    container_name: "redis"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?}
      - REDIS_USER=${REDIS_USER:?}
      - REDIS_USER_PASSWORD=${REDIS_USER_PASSWORD:?}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --user default off
      --user ${REDIS_USER} on ">"${REDIS_USER_PASSWORD} ~* +@all
    healthcheck:
      <<: *health-defaults
      test: ["CMD-SHELL", "redis-cli -e --user \"$REDIS_USER\" --pass \"$REDIS_USER_PASSWORD\" ping"]
    volumes:
      - ${VOLUMES_PATH:?}/redis/data:/var/lib/redis/data
    ports:
      - ${REDIS_PORT:-6379}:6379


networks:
  sensors-backend-network:
    name: "sensors-backend-network"
    driver: bridge
    external: false
